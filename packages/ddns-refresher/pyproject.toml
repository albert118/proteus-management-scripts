[project]
name = "ddns-refresher"
version = "0.1.0"
description = "Refreshes a Cloudflare DNS A record when the public IP address changes."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-describe>=3.2.0",
    "pytest-github-report>=0.0.1",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[project.scripts]
ddns-refresher = "ddns_refresher.main:main"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
describe_prefixes = ["describe_"]
python_functions = ["test_*", "it_*"]
