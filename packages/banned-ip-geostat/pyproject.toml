[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "banned_ip_geostat"
version = "0.1.0"
description = "Checks for banned IPs in the Fail2Ban Jails and reports their geo' stats."
readme = "README.md"
authors = [
  { name="Albert Ferguson", email="albertferguson118@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [] # Add external pip packages here

[project.urls]
Homepage = "https://github.com/albert118/proteus-management-scripts"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests>=2.31",
    "coverage>=7.13",
    "pyyaml>=6.0"
]

[tool.setuptools]
script-files = [
    "scripts/check-banned-ips.sh",
    "scripts/dns-health-check.sh",
    "scripts/ip-bans-by-country.sh"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
