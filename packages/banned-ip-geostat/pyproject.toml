[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "banned_ip_geostat"
version = "0.1.0"
description = "Checks for banned IPs in the Fail2Ban Jails and reports their geo' stats."
readme = "README.md"
authors = [
  { name="Albert Ferguson", email="albertferguson118@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [] # Add external pip packages here

[project.urls]
Homepage = "https://github.com/albert118/proteus-management-scripts"

[project.optional-dependencies]
dev = [
    "requests>=2.31",
]
test = [
  "pytest>=8.0.0",
  "pytest-describe>=2.2.0",
  "coverage>=7.13",
  "pyyaml>=6.0",
]

[tool.setuptools]
script-files = [
    "scripts/check-banned-ips.sh",
    "scripts/dns-health-check.sh",
    "scripts/ip-bans-by-country.sh"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
describe_prefixes = ["describe_"]
python_functions = ["test_*", "it_*"]
