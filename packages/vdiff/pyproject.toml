[project]
name = "vdiff"
version = "1.0.0"
description = "Check given video stream for issues using a few strategies. This works for lossy re-encodes by checking the result against a snapshot of the original file."
readme = "README.md"
authors = [
  { name="Albert Ferguson", email="albertferguson118@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [] # Add external pip packages here

[project.urls]
Homepage = "https://github.com/albert118/proteus-management-scripts"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "requests>=2.31",
    "pytest>=8.3.0",
    "pytest-describe>=3.2.0",
    "pytest-github-report>=0.0.1",
    "coverage>=7.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
describe_prefixes = ["describe_"]
python_functions = ["test_*", "it_*"]
