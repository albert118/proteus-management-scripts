[project]
name = "ip_tools"
version = "0.1.0"
description = "Checks for banned IPs in the Fail2Ban Jails and reports their geo' stats."
readme = "README.md"
authors = [
  { name="Albert Ferguson", email="albertferguson118@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = []

[project.urls]
Homepage = "https://github.com/albert118/proteus-management-scripts"

[dependency-groups]
dev = [
  "pytest-describe>=3.2.0",
  "requests>=2.31",
  "pytest-github-report>=0.0.1",
]

test = [
  "pytest>=8.0.0",
  "pytest-describe>=2.2.0",
  "coverage>=7.13",
  "pyyaml>=6.0",
]

[tool.setuptools]
script-files = [
    "scripts/check-banned-ips.sh",
    "scripts/dns-health-check.sh",
    "scripts/ip-bans-by-country.sh"
]

[project.scripts]
ip-tools = "ip_tools.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
describe_prefixes = ["describe_"]
python_functions = ["test_*", "it_*"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
