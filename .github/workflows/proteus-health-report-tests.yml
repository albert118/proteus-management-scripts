# Run the tests for the health report package
# ----------------------------------
name: CI - proteus-health-report

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: 
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    defaults:
      run:
        working-directory: ./packages/proteus-health-report

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and setup Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build
        run: uv build

      - name: Run tests (pytest)
        run: uv run pytest
